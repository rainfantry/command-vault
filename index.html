  :root {

  .header {
    text-align: center;

  }
  .header h1 {

    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tag {
    font-size: 0.65rem;
    padding: 5px 14px;
    border: 1px solid;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
    opacity: 0.35;
    background: transparent;
  }
  .tag:hover {
    opacity: 0.7;
    transform: translateY(-1px);
  }
  .tag.active {
    opacity: 1;
    transform: translateY(0);
    font-weight: bold;
    box-shadow: 0 0 8px currentColor;
  }
  .tag.vps { color: var(--yellow); border-color: var(--yellow); }

  .tag.ps.active { background: var(--cyan); color: var(--bg); }

  .tag.defender.active { background: var(--red); color: #fff; }

  .tag.postexploit { color: #ff9800; border-color: #ff9800; }
  .tag.postexploit.active { background: #ff9800; color: #fff; }
  .tag.lateral { color: #00bcd4; border-color: #00bcd4; }

  .tag.playbook { color: #ffeb3b; border-color: #ffeb3b; }

  .tag.recon { color: #4caf50; border-color: #4caf50; }

  .tag.cloud { color: #03a9f4; border-color: #03a9f4; }

  .tag.chaos { color: #ff2a6d; border-color: #ff2a6d; }

  .cmd-tag.c2 { color: #ff6b35; border-color: #ff6b35; }
  .cmd-tag.privesc { color: #9b59b6; border-color: #9b59b6; }
  .cmd-tag.persist { color: #e74c3c; border-color: #e74c3c; }
  .cmd-tag.firewall { color: #3498db; border-color: #3498db; }
  .cmd-tag.evasion { color: #e91e63; border-color: #e91e63; }
  .cmd-tag.postexploit { color: #ff9800; border-color: #ff9800; }
  .cmd-tag.lateral { color: #00bcd4; border-color: #00bcd4; }

  .cmd-tag.cloud { color: #03a9f4; border-color: #03a9f4; }
  .cmd-tag.chaos { color: #ff2a6d; border-color: #ff2a6d; }
  .cmd-tag.ssh { color: #8bc34a; border-color: #8bc34a; }

    text-align: center;
    font-size: 0.6rem;
    opacity: 0.4;
    margin-bottom: 12px;
  }
  .cmd-list {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cmd-item {
    background: var(--bg-card);

    margin-bottom: 8px;

  .cmd-title {
    font-size: 0.75rem;
    color: var(--cyan);

  .cmd-tag {
    font-size: 0.5rem;
    padding: 1px 8px;
    border: 1px solid;
  }
  .cmd-tag.vps { color: var(--yellow); border-color: var(--yellow); }
  .cmd-tag.ps { color: var(--cyan); border-color: var(--cyan); }
  .cmd-tag.defender { color: var(--red); border-color: var(--red); }
  .cmd-tag.linux { color: var(--green); border-color: var(--green); }
  .cmd-tag.git { color: var(--text); border-color: var(--text); }
  .cmd-desc {
    font-size: 0.6rem;
    color: #888;
    margin-bottom: 8px;
    padding-left: 4px;
    font-style: italic;
  }
  .cmd-code {
    font-size: 0.7rem;
    color: var(--text);
    background: rgba(0,0,0,0.3);
    padding: 10px 12px;
    border-left: 2px solid;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
    font-family: 'Share Tech Mono', monospace;
  }
  .cmd-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }
  .btn {
    font-size: 0.6rem;
    padding: 4px 14px;
    border: 1px solid rgba(0,240,255,0.3);
    background: transparent;
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(0,240,255,0.1); }
  .btn.copied { color: var(--green); border-color: var(--green); }
  .footer {
    text-align: center;
    margin-top: 30px;
    font-size: 0.5rem;
    opacity: 0.3;
    letter-spacing: 2px;
  }
  @media (max-width: 600px) {
    .header h1 { font-size: 1.2rem; }
    .cmd-code { font-size: 0.6rem; }
  }
</style>
</head>

const list = document.getElementById('cmdList');
const search = document.getElementById('search');
const count = document.getElementById('count');
const tagButtons = document.querySelectorAll('.tag');

let activeFilters = new Set();

function render() {
  const term = search.value.toLowerCase().trim();
  let visible = 0;

  list.innerHTML = COMMANDS.map((cmd, idx) => {
    const matchesTerm = !term || cmd.title.toLowerCase().includes(term) || cmd.code.toLowerCase().includes(term) || (cmd.desc && cmd.desc.toLowerCase().includes(term));
    const matchesTag = activeFilters.size === 0 || cmd.tags.some(t => activeFilters.has(t));
    const show = matchesTerm && matchesTag;
    if (show) visible++;

    return `
      <div class="cmd-item ${show ? '' : 'hidden'}">
        <div class="cmd-meta">
          <div class="cmd-title">${cmd.title}</div>
          ${cmd.tags.map(t => `<div class="cmd-tag ${t}">${t.toUpperCase()}</div>`).join('')}
        </div>
        ${cmd.desc ? `<div class="cmd-desc">${cmd.desc}</div>` : ''}
        <div class="cmd-code" style="border-left-color:${cmd.accent}">${escapeHtml(cmd.code)}</div>
        <div class="cmd-actions">
          <button class="btn" onclick="copyCmd(${idx}, this)">COPY</button>
        </div>
      </div>
    `;
  }).join('');

  count.textContent = `${visible} command${visible !== 1 ? 's' : ''} visible`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyCmd(idx, btn) {
  const text = COMMANDS[idx].code;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'COPIED';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 1500);
  });
}

search.addEventListener('input', render);

tagButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    if (activeFilters.has(f)) {
      activeFilters.delete(f);
      btn.classList.remove('active');
    } else {
      activeFilters.add(f);
      btn.classList.add('active');
    }
    render();
  });
});

render();
</script>
